name: Auto Bump Version and Release

on:
  push:
    branches:
      - dev
      - test

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    # Optional: Only run if the commit message indicates a merge from a feature branch
    # if: "startsWith(github.event.head_commit.message, 'Merge pull request') || startsWith(github.event.head_commit.message, 'Merge branch')"
    
    permissions:
      contents: write # Required to push commits, tags, and create releases
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: Need full history for tags and back-merges
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Run Version Bump Script
        run: python bump_version.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for the 'gh' CLI inside the script
