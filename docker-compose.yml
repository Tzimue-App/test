services:

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: template-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-templatedb}
      POSTGRES_USER:     ${DB_USER:-template}
      POSTGRES_PASSWORD: ${DB_PASS:-template}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-template} -d ${DB_NAME:-templatedb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot App ────────────────────────────────────────
  app:
    build: .
    container_name: template-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:   prod
      DB_URL:                   jdbc:postgresql://db:5432/${DB_NAME:-templatedb}
      DB_USER:                  ${DB_USER:-template}
      DB_PASS:                  ${DB_PASS:-template}
      GOOGLE_CLIENT_ID:         ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET:     ${GOOGLE_CLIENT_SECRET}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
    name: template-postgres-data

networks:
  default:
    name: template-network
