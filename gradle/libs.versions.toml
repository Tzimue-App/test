[versions]
spring-boot          = "3.4.4"
spring-dep-mgmt      = "1.1.7"
mapstruct            = "1.6.3"
lombok               = "1.18.44"
lombok-mapstruct     = "0.2.0"
thymeleaf-layout     = "3.3.0"
bootstrap            = "5.3.3"
bootstrap-icons      = "1.11.3"
webjars-locator      = "0.52"
testcontainers       = "2.0.5"
jacoco               = "0.8.12"
flyway               = "10.21.0"
bytebuddy            = "1.18.8"

[libraries]
# Spring Boot BOM (for platform() import)
spring-boot-bom              = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-web              = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-thymeleaf        = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-jpa              = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-security         = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-validation       = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-actuator         = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-oauth2           = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-boot-devtools         = { module = "org.springframework.boot:spring-boot-devtools" }
spring-security-thymeleaf    = { module = "org.thymeleaf.extras:thymeleaf-extras-springsecurity6" }
thymeleaf-layout-dialect     = { module = "nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect", version.ref = "thymeleaf-layout" }

# Database
postgresql                   = { module = "org.postgresql:postgresql" }
flyway-core                  = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql            = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# WebJars
bootstrap                    = { module = "org.webjars:bootstrap", version.ref = "bootstrap" }
bootstrap-icons              = { module = "org.webjars.npm:bootstrap-icons", version.ref = "bootstrap-icons" }
webjars-locator              = { module = "org.webjars:webjars-locator-core", version.ref = "webjars-locator" }

# MapStruct + Lombok
mapstruct                    = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor          = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok                       = { module = "org.projectlombok:lombok", version.ref = "lombok" }
lombok-mapstruct-binding     = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct" }

# Test
spring-boot-test             = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers   = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-security-test         = { module = "org.springframework.security:spring-security-test" }
testcontainers-bom           = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit         = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql    = { module = "org.testcontainers:postgresql" }
junit-launcher               = { module = "org.junit.platform:junit-platform-launcher" }
bytebuddy                    = { module = "net.bytebuddy:byte-buddy", version.ref = "bytebuddy" }
bytebuddy-agent              = { module = "net.bytebuddy:byte-buddy-agent", version.ref = "bytebuddy" }

[plugins]
spring-boot      = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dep-mgmt  = { id = "io.spring.dependency-management", version.ref = "spring-dep-mgmt" }
