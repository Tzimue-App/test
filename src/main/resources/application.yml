spring:
  application:
    name: springboot-template
  profiles:
    active: dev

  # JPA
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Thymeleaf
  thymeleaf:
    cache: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # OAuth2 — values injected via environment variables
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
