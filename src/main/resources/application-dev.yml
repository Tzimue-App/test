spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:templatedb}
    username: ${DB_USER:template}
    password: ${DB_PASS:template}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    com.template.springboot: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: 8080
