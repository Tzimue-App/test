<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${categoryDto.id != null} ? #{page.category.edit} : #{page.category.new}">Category</title>
</head>
<body>
<main layout:fragment="content">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="d-flex align-items-center mb-4">
                <a th:href="@{/categories}" class="btn btn-sm btn-outline-secondary me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h1 class="h4 fw-bold mb-0"
                    th:text="${categoryDto.id != null} ? #{page.category.edit} : #{page.category.new}">
                    Category
                </h1>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:action="${categoryDto.id != null}
                                    ? @{/categories/{id}(id=${categoryDto.id})}
                                    : @{/categories}"
                          th:object="${categoryDto}" method="post">

                        <!-- Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Name *</label>
                            <input id="name" type="text" th:field="*{name}"
                                   class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   placeholder="Category name"/>
                            <div class="invalid-feedback" th:errors="*{name}">Name error</div>
                        </div>

                        <!-- Description -->
                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold">Description</label>
                            <textarea id="description" th:field="*{description}" rows="3"
                                      class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                      placeholder="Optional description..."></textarea>
                            <div class="invalid-feedback" th:errors="*{description}">Description error</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-floppy me-1"></i>
                                <span th:text="#{action.save}">Save</span>
                            </button>
                            <a th:href="@{/categories}" class="btn btn-outline-secondary"
                               th:text="#{action.cancel}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

</main>
</body>
</html>
