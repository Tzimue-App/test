<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="#{page.category.list}">Categories</title></head>
<body>
<main layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0">
            <i class="bi bi-grid me-2 text-primary"></i>
            <span th:text="#{page.category.list}">Categories</span>
        </h1>
        <a th:href="@{/categories/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>
            <span th:text="#{page.category.new}">New Category</span>
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th class="text-center">Items</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${page.content}">
                        <td class="text-muted small" th:text="${cat.id}">1</td>
                        <td class="fw-semibold" th:text="${cat.name}">Name</td>
                        <td class="text-muted small" th:text="${cat.description}">—</td>
                        <td class="text-center">
                            <a th:href="@{/items(categoryId=${cat.id})}"
                               class="badge bg-primary text-decoration-none"
                               th:text="${cat.itemCount}">0</a>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/categories/{id}/edit(id=${cat.id})}"
                               class="btn btn-sm btn-outline-secondary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/categories/{id}/delete(id=${cat.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this category?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${page.isEmpty()}">
                        <td colspan="5" class="text-center text-muted py-4">
                            No categories yet. <a th:href="@{/categories/new}">Create one.</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${page.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/categories(page=${page.number - 1})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:href="@{/categories(page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/categories(page=${page.number + 1})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>

</main>
</body>
</html>
