<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Error 4xx</title></head>
<body>
<main layout:fragment="content">
    <div class="text-center py-5">
        <i class="bi bi-exclamation-circle display-1 text-warning"></i>
        <h1 class="display-5 fw-bold mt-3" th:text="${status + ' — Not Found'}">404 — Not Found</h1>
        <p class="lead text-muted" th:text="${message}">The resource you requested does not exist.</p>
        <a th:href="@{/}" class="btn btn-primary mt-3">
            <i class="bi bi-house me-2"></i>Back to Home
        </a>
    </div>
</main>
</body>
</html>
