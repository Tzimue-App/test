<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Login</title></head>
<body>
<main layout:fragment="content">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <i class="bi bi-lock-fill fs-1 text-primary"></i>
                        <h1 class="h3 mt-2 fw-bold">Sign in</h1>
                        <p class="text-muted small">Access your account</p>
                    </div>

                    <!-- Error / Logout feedback -->
                    <div th:if="${errorMsg}"  class="alert alert-danger  small" th:text="${errorMsg}"></div>
                    <div th:if="${logoutMsg}" class="alert alert-success small" th:text="${logoutMsg}"></div>

                    <!-- Local login form -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Email address</label>
                            <input id="username" type="email" name="username"
                                   class="form-control" placeholder="you@example.com" required autofocus/>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" type="password" name="password"
                                   class="form-control" placeholder="••••••••" required/>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe"/>
                            <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
                        </button>
                    </form>

                    <div class="text-center text-muted small my-3">— or continue with —</div>

                    <!-- OAuth2 Google -->
                    <a th:href="@{/oauth2/authorization/google}"
                       class="btn btn-outline-danger w-100">
                        <i class="bi bi-google me-2"></i>Sign in with Google
                    </a>

                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
