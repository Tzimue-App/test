<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${itemDto.id != null} ? #{page.item.edit} : #{page.item.new}">Item</title>
</head>
<body>
<main layout:fragment="content">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="d-flex align-items-center mb-4">
                <a th:href="@{/items}" class="btn btn-sm btn-outline-secondary me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h1 class="h4 fw-bold mb-0"
                    th:text="${itemDto.id != null} ? #{page.item.edit} : #{page.item.new}">
                    Item
                </h1>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:action="${itemDto.id != null}
                                    ? @{/items/{id}(id=${itemDto.id})}
                                    : @{/items}"
                          th:object="${itemDto}" method="post">

                        <!-- Category selector -->
                        <div class="mb-3">
                            <label for="categoryId" class="form-label fw-semibold">Category *</label>
                            <select id="categoryId" th:field="*{categoryId}"
                                    class="form-select" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                                <option value="">— Select a category —</option>
                                <option th:each="cat : ${categories.content}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}">Category</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{categoryId}">Category error</div>
                        </div>

                        <!-- Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Name *</label>
                            <input id="name" type="text" th:field="*{name}"
                                   class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   placeholder="Item name"/>
                            <div class="invalid-feedback" th:errors="*{name}">Name error</div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description</label>
                            <textarea id="description" th:field="*{description}" rows="3"
                                      class="form-control"
                                      placeholder="Optional description..."></textarea>
                        </div>

                        <!-- Price -->
                        <div class="mb-4">
                            <label for="price" class="form-label fw-semibold">Price (€)</label>
                            <div class="input-group">
                                <span class="input-group-text">€</span>
                                <input id="price" type="number" step="0.01" min="0"
                                       th:field="*{price}"
                                       class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                       placeholder="0.00"/>
                                <div class="invalid-feedback" th:errors="*{price}">Price error</div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-floppy me-1"></i>
                                <span th:text="#{action.save}">Save</span>
                            </button>
                            <a th:href="@{/items}" class="btn btn-outline-secondary"
                               th:text="#{action.cancel}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

</main>
</body>
</html>
