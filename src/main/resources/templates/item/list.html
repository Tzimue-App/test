<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="#{page.item.list}">Items</title></head>
<body>
<main layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0">
            <i class="bi bi-box me-2 text-primary"></i>
            <span th:text="#{page.item.list}">Items</span>
        </h1>
        <a th:href="@{/items/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>
            <span th:text="#{page.item.new}">New Item</span>
        </a>
    </div>

    <!-- Category filter pills -->
    <div class="mb-3 d-flex flex-wrap gap-2">
        <a th:href="@{/items}" class="btn btn-sm"
           th:classappend="${selectedCategoryId == null} ? 'btn-dark' : 'btn-outline-secondary'">
            All
        </a>
        <a th:each="cat : ${categories.content}"
           th:href="@{/items(categoryId=${cat.id})}"
           class="btn btn-sm"
           th:classappend="${selectedCategoryId == cat.id} ? 'btn-dark' : 'btn-outline-secondary'"
           th:text="${cat.name}">Category</a>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="item : ${page.content}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <span class="badge bg-secondary mb-2" th:text="${item.categoryName}">Category</span>
                    <h5 class="card-title" th:text="${item.name}">Item name</h5>
                    <p class="card-text text-muted small"
                       th:text="${item.description ?: 'No description.'}">Description</p>
                </div>
                <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-primary fs-5"
                          th:text="${item.price != null ? '€' + #numbers.formatDecimal(item.price,1,2) : '—'}">
                        €0.00
                    </span>
                    <div class="btn-group btn-group-sm">
                        <a th:href="@{/items/{id}/edit(id=${item.id})}" class="btn btn-outline-secondary">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post"
                              onsubmit="return confirm('Delete this item?')">
                            <button type="submit" class="btn btn-outline-danger rounded-end">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${page.isEmpty()}" class="col-12">
            <div class="text-center text-muted py-5">
                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                No items found. <a th:href="@{/items/new}">Add the first one.</a>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${page.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/items(page=${page.number - 1}, categoryId=${selectedCategoryId})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/items(page=${i}, categoryId=${selectedCategoryId})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/items(page=${page.number + 1}, categoryId=${selectedCategoryId})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>

</main>
</body>
</html>
